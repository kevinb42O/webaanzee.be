<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Webaanzee — beeldstudie Kevin aan zijn bureau</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #0e100f; }
    .scene { position: relative; width: 100%; height: 100svh; overflow: hidden; }
    img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; }
    .coast { object-position: 58% center; }
    .foreground { object-position: 50% center; }
  </style>
</head>
<body>
  <main class="scene" aria-label="Conceptbeeld: Kevin werkt op zijn laptop aan een bureau bij het ronde raam, met de pier van Blankenberge bij zonsondergang als uitzicht">
    <img class="coast" src="/blankenberge-pier-uhd.webp" alt="De pier van Blankenberge bij zonsondergang" />
    <img class="foreground" src="/images/opener/kevin-desk-sunset-v7.webp" alt="Gegenereerd concept van Kevin die op zijn laptop werkt bij het ronde raam" />
  </main>
</body>
</html>
