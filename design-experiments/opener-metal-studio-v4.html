<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Webaanzee — beeldstudie metaalatelier</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #0e100f; }
    .scene { position: relative; width: 100%; height: 100svh; overflow: hidden; }
    img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; }
    .coast { object-position: 58% center; }
    .foreground { object-position: 50% center; }
  </style>
</head>
<body>
  <main class="scene" aria-label="Beeldstudie: een ontwerper aan een metalen opening met zicht op de pier van Blankenberge bij zonsondergang">
    <img class="coast" src="/blankenberge-pier-uhd.webp" alt="De pier van Blankenberge bij zonsondergang" />
    <img class="foreground" src="/images/opener/coastal-metal-studio-v4.webp" alt="Ontwerper bij een ronde opening in een donker metalen atelier" />
  </main>
</body>
</html>
